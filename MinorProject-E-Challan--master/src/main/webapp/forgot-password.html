<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FINESNAP</title>

    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="stylesheet" href="login.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <i class="fas fa-sun theme-icon"></i>
    <i class="fas fa-moon theme-icon"></i>
</button>

<div class="login-wrapper">
    <div class="login-container">
        <div class="header">
            <div class="logo-container">
                <img src="finesnap_logo.png" alt="FineSnap Logo" class="logo">
            </div>
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter your email to receive a reset link</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage" style="display: none;">
            <i class="ri-checkbox-circle-line"></i>
            <span id="successText">Reset link sent successfully!</span>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage" style="display: none;">
            <i class="ri-error-warning-line"></i>
            <span id="errorText">Email not found!</span>
        </div>

        <!-- ✅ Form submits to ForgotPasswordServlet -->
        <form class="login-form" action="ForgotPasswordServlet" method="POST" id="forgotPasswordForm">
            <h2>
                <i class="ri-mail-send-line"></i>
                Reset Password
            </h2>

            <div class="input-group">
                <label for="email">
                    <i class="ri-mail-line"></i>
                    Email Address
                </label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your registered email" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="ri-mail-send-line"></i>
                Send Reset Link
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <a href="login.html" class="signup-btn">
            <i class="ri-arrow-left-line"></i>
            Back to Login
        </a>

        <div class="footer-text">
            <i class="ri-arrow-left-line"></i>
            <a href="index.html" style="color: var(--accent-primary); text-decoration: none;">Back to Home</a>
        </div>
    </div>
</div>

<script>
    // ========== THEME TOGGLE ==========
    (function() {
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', function() {
            const currentTheme = htmlElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';

            if (currentTheme === 'light') {
                htmlElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
            }
        });
    })();

    // ========== CHECK FOR SUCCESS/ERROR PARAMETERS ==========
    (function() {
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.get('success')) {
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            successText.textContent = 'Password reset link has been sent to your email!';
            successMessage.style.display = 'flex';
        }

        if (urlParams.get('error')) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = 'Email not found in our system!';
            errorMessage.style.display = 'flex';
        }
    })();
</script>

<style>
    /* Success message styling */
    .success-message {
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 1.5rem;
        animation: slideIn 0.4s ease;
    }

    .success-message i {
        font-size: 1.5rem;
        color: #fff;
    }

    .success-message span {
        color: #fff;
        font-weight: 500;
        font-size: 0.95rem;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</body>
</html>
